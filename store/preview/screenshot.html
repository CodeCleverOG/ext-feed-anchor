<!doctype html>
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         display: flex; align-items: center; gap: 72px; padding: 0 110px; box-sizing: border-box;
         background: radial-gradient(circle at 80% 30%, #ccfbf1, #f0fdfa 55%, #ffffff); color: #0f172a; }
  body.dark { background: radial-gradient(circle at 80% 30%, #134e4a, #0b1f24 60%, #070f14); color: #e5e7eb; }
  .copy { flex: 1; }
  .brand { display: flex; align-items: center; gap: 14px; font-weight: 600; font-size: 22px; color: #0f766e; margin-bottom: 28px; }
  .dark .brand { color: #5eead4; }
  .brand img { width: 52px; height: 52px; }
  h1 { font-size: 54px; line-height: 1.08; letter-spacing: -.02em; margin: 0 0 22px; }
  p { font-size: 22px; line-height: 1.5; margin: 0; color: #475569; max-width: 520px; }
  .dark p { color: #9ca3af; }
  .shot { width: 600px; border-radius: 18px; overflow: hidden; flex: none;
          box-shadow: 0 30px 80px rgba(15, 118, 110, .25), 0 4px 14px rgba(0,0,0,.12); }
  .shot img { display: block; width: 100%; }
</style></head><body>
  <div class="copy">
    <div class="brand"><img src="../../src/icons/icon128.png" alt="">Feed Anchor</div>
    <h1 id="h"></h1><p id="p"></p>
  </div>
  <div class="shot"><img id="img" alt=""></div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById("h").textContent = q.get("h");
  document.getElementById("p").textContent = q.get("p");
  document.getElementById("img").src = q.get("img");
  if (q.get("theme") === "dark") document.body.className = "dark";
</script></body></html>
